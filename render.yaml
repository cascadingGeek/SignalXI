# Render Blueprint (spec _root 0001): API and scheduler worker from one Docker
# image, plus Key Value, all in Frankfurt. Deploys only after CI passes on main.
# Secrets marked `sync: false` are entered once in the Render dashboard.
services:
  - type: web
    name: signalxi-api
    runtime: docker
    region: frankfurt
    plan: standard
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: signalxi-redis
          property: connectionString

  - type: worker
    name: signalxi-scheduler
    runtime: docker
    region: frankfurt
    plan: standard
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.core.scheduler
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: signalxi-redis
          property: connectionString

  - type: keyvalue
    name: signalxi-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: volatile-lru
    ipAllowList: []
