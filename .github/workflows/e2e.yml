name: e2e

on:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:54322/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
      SUPABASE_URL: http://127.0.0.1:54321
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Start API
        working-directory: backend
        run: |
          uv sync --locked --no-dev
          nohup uv run --no-dev uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build and start web
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start --port 3000 > ../web.log 2>&1 &
      - name: Install Playwright
        working-directory: frontend
        run: pnpm test:e2e:install
      - name: Wait for both apps
        run: |
          timeout 60 sh -c 'until curl -fs http://localhost:8000/healthz; do sleep 1; done'
          timeout 60 sh -c 'until curl -fs http://localhost:3000 > /dev/null; do sleep 1; done'
      - name: Run e2e
        working-directory: frontend
        run: pnpm test:e2e
      - name: Logs on failure
        if: failure()
        run: tail -n 200 api.log web.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
